name: release

# Publish a signed, stable (non-SNAPSHOT) build to Maven Central when a
# version tag is pushed. The tag name *is* the published version: pushing the
# tag `0.18.0-2` publishes `0.18.0-2`.
#
# Versions are pinned to Jake Wharton's last upstream release (0.18.0) plus a
# numeric suffix we control and increment per fork release:
#   0.18.0-1, 0.18.0-2, 0.18.0-3, ...
# In-development builds stay on 0.18.0-SNAPSHOT (gradle.properties) and are
# published by snapshot.yaml.

on:
  push:
    tags:
      # Version-like tags only (must start with a digit), so arbitrary tags
      # don't trigger a publish.
      - '[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  publish-release:
    if: ${{ github.repository == 'yschimke/mosaic' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v6

      - id: version
        name: Derive version from tag
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to publish a -SNAPSHOT tag: $version" >&2
            exit 1
          fi
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Maven stable release" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew -PVERSION_NAME=${{ steps.version.outputs.version }} publish
