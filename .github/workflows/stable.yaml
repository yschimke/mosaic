name: stable

# Publish a signed, stable (non-SNAPSHOT) build to Maven Central.
#
# The version is pinned to Jake Wharton's last upstream release (the base
# component of VERSION_NAME in gradle.properties, e.g. `0.18.0`) plus a
# numeric suffix we control and increment for each fork release:
#   0.18.0-1, 0.18.0-2, 0.18.0-3, ...
#
# Run this manually from the Actions tab. Leave `suffix` blank to publish the
# suffix already recorded in gradle.properties, or pass a new number to bump
# it without editing the file.

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: >-
          Numeric fork-release suffix appended to Jake Wharton's last release
          (e.g. `2` -> 0.18.0-2). Leave blank to use the suffix already in
          gradle.properties.
        required: false
        type: string

concurrency:
  group: stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dkotlin.incremental=false -Dorg.gradle.logging.stacktrace=full"

jobs:
  publish-stable:
    if: ${{ github.repository == 'yschimke/mosaic' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.java-version
      - uses: gradle/actions/setup-gradle@v6

      - id: version
        name: Compute stable version
        env:
          INPUT_SUFFIX: ${{ inputs.suffix || '' }}
        run: |
          raw="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          # Strip any -SNAPSHOT and any existing -<suffix> to recover Jake's
          # last upstream release, e.g. 0.18.0-1 -> 0.18.0, 0.18.0-SNAPSHOT -> 0.18.0.
          base="${raw%-SNAPSHOT}"
          existing_suffix=""
          if [[ "$base" =~ ^(.+)-([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            existing_suffix="${BASH_REMATCH[2]}"
          fi

          suffix="$INPUT_SUFFIX"
          if [[ -z "$suffix" ]]; then
            suffix="$existing_suffix"
          fi
          if [[ -z "$suffix" ]]; then
            echo "No suffix supplied and none found in gradle.properties." >&2
            exit 1
          fi
          if [[ ! "$suffix" =~ ^[0-9]+$ ]]; then
            echo "Suffix must be numeric, got: $suffix" >&2
            exit 1
          fi

          version="${base}-${suffix}"
          echo "Stable version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Maven stable release" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew -PVERSION_NAME=${{ steps.version.outputs.version }} publish
